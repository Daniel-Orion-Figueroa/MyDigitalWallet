<ion-content [fullscreen]="true">
  <!-- Header curvo con botón de atrás -->
  <div class="curved-header-bg ion-padding-top ion-padding-horizontal">
    <ion-buttons class="back-btn-container">
      <ion-back-button defaultHref="/login" color="light" text=""></ion-back-button>
    </ion-buttons>
    <div class="header-content ion-margin-top ion-margin-bottom">
      <h1 class="header-title">Register</h1>
      <p class="header-subtitle">Create your account</p>
    </div>
  </div>

  <div class="register-container ion-padding">
    <div class="glass-panel ion-padding form-wrapper">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        
        <!-- Fila de Nombres -->
        <ion-row class="input-row">
          <ion-col size="6" class="ion-no-padding padding-right-sm">
            <div class="input-group">
              <ion-label position="stacked" class="premium-label">First Name</ion-label>
              <ion-input class="premium-input" type="text" formControlName="firstName" placeholder="Ferdinand"></ion-input>
            </div>
          </ion-col>
          <ion-col size="6" class="ion-no-padding padding-left-sm">
            <div class="input-group">
              <ion-label position="stacked" class="premium-label">Last Name</ion-label>
              <ion-input class="premium-input" type="text" formControlName="lastName" placeholder="Sinaga"></ion-input>
            </div>
          </ion-col>
        </ion-row>

        <!-- Fila de Documento -->
        <ion-row class="input-row">
          <ion-col size="4" class="ion-no-padding padding-right-sm">
            <div class="input-group">
              <ion-label position="stacked" class="premium-label">Doc Type</ion-label>
              <ion-select formControlName="documentType" interface="popover" class="premium-input custom-select">
                <ion-select-option *ngFor="let type of documentTypes" [value]="type.value">{{ type.label }}</ion-select-option>
              </ion-select>
            </div>
          </ion-col>
          <ion-col size="8" class="ion-no-padding padding-left-sm">
            <div class="input-group">
              <ion-label position="stacked" class="premium-label">Doc Number</ion-label>
              <ion-input class="premium-input" type="text" formControlName="documentNumber" placeholder="12345678"></ion-input>
            </div>
          </ion-col>
        </ion-row>

        <!-- País -->
        <div class="input-group">
          <ion-label position="stacked" class="premium-label">Country</ion-label>
          <ion-select formControlName="country" interface="popover" class="premium-input custom-select">
            <ion-select-option *ngFor="let country of countries" [value]="country.value">{{ country.label }}</ion-select-option>
          </ion-select>
        </div>

        <!-- Email -->
        <div class="input-group">
          <ion-label position="stacked" class="premium-label">Email</ion-label>
          <ion-input class="premium-input" type="email" formControlName="email" placeholder="example@gmail.com"></ion-input>
        </div>

        <!-- Contraseña -->
        <div class="input-group">
          <ion-label position="stacked" class="premium-label">Password</ion-label>
          <div class="password-wrapper">
            <ion-input class="premium-input" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••"></ion-input>
            <ion-button fill="clear" class="eye-btn" (click)="togglePasswordVisibility('password')">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" color="medium"></ion-icon>
            </ion-button>
          </div>
        </div>
        
        <!-- Confirmar Contraseña -->
        <div class="input-group">
          <ion-label position="stacked" class="premium-label">Confirm Password</ion-label>
          <div class="password-wrapper">
            <ion-input class="premium-input" [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" placeholder="••••••••"></ion-input>
            <ion-button fill="clear" class="eye-btn" (click)="togglePasswordVisibility('confirmPassword')">
              <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'" color="medium"></ion-icon>
            </ion-button>
          </div>
        </div>

        <!-- Error global de validación -->
        <div class="error-msg" *ngIf="isSubmitted && registerForm.invalid">
          Please fill all required fields properly.
        </div>

        <!-- Botón de Registro -->
        <ion-button type="submit" expand="block" class="premium-btn ion-margin-top" [disabled]="isLoading || registerForm.invalid">
          <ion-spinner *ngIf="isLoading" name="crescent" slot="start"></ion-spinner>
          {{ isLoading ? 'REGISTERING...' : 'REGISTER' }}
        </ion-button>
      </form>
    </div>

    <!-- Enlace a Login -->
    <div class="login-link ion-margin-top">
      <ion-text color="medium">
        I have an account? <a (click)="goToLogin()" class="action-link">Log in</a>
      </ion-text>
    </div>
  </div>
</ion-content>
