<ion-content [fullscreen]="true">
  <!-- Header curvo -->
  <div class="curved-header-bg ion-padding-top ion-padding-horizontal">
    <div class="header-content ion-margin-top ion-margin-bottom">
      <h1 class="header-title">Sign in to your<br>Account</h1>
      <p class="header-subtitle">Sign in to your Account</p>
    </div>
  </div>

  <div class="login-container ion-padding">
    <!-- Formulario de Login (Glass Panel) -->
    <div class="glass-panel ion-padding form-wrapper">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div class="input-group">
          <ion-label position="stacked" class="premium-label">Email</ion-label>
          <ion-input 
            class="premium-input"
            type="email" 
            formControlName="email" 
            placeholder="example@gmail.com"
            autocomplete="email"
          ></ion-input>
          <!-- Error de Email -->
          <div class="error-msg" *ngIf="isSubmitted && email?.invalid">
            <span *ngIf="email?.errors?.['required']">Email is required</span>
            <span *ngIf="email?.errors?.['email']">Invalid email address</span>
          </div>
        </div>

        <!-- Contraseña -->
        <div class="input-group">
          <ion-label position="stacked" class="premium-label">Password</ion-label>
          <div class="password-wrapper">
            <ion-input 
              class="premium-input"
              [type]="showPassword ? 'text' : 'password'" 
              formControlName="password" 
              placeholder="••••••••"
              autocomplete="current-password"
            ></ion-input>
            <ion-button 
              fill="clear" 
              class="eye-btn"
              (click)="togglePasswordVisibility()"
            >
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" color="medium"></ion-icon>
            </ion-button>
          </div>
          <!-- Error de Contraseña -->
          <div class="error-msg" *ngIf="isSubmitted && password?.invalid">
            <span *ngIf="password?.errors?.['required']">Password is required</span>
            <span *ngIf="password?.errors?.['minlength']">Min 6 characters</span>
          </div>
        </div>

        <div class="forgot-pwd">
          <a class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Botón de Login -->
        <ion-button 
          type="submit" 
          expand="block" 
          class="premium-btn ion-margin-top"
          [disabled]="isLoading || loginForm.invalid"
        >
          <ion-spinner *ngIf="isLoading" name="crescent" slot="start"></ion-spinner>
          {{ isLoading ? 'LOGGING IN...' : 'LOGIN' }}
        </ion-button>
      </form>

      <!-- Separador -->
      <div class="divider">
        <ion-text>Or login with</ion-text>
      </div>

      <!-- Botón de Google -->
      <ion-button 
        expand="block" 
        class="google-btn"
        (click)="loginWithGoogle()"
        [disabled]="isLoading"
      >
        <ion-icon name="logo-google" slot="start"></ion-icon>
        GOOGLE
      </ion-button>
    </div>

    <!-- Enlace a Registro -->
    <div class="register-link ion-margin-top">
      <ion-text color="medium">
        Don't have an account? 
        <a (click)="goToRegister()" class="action-link">Register</a>
      </ion-text>
    </div>
  </div>
</ion-content>
