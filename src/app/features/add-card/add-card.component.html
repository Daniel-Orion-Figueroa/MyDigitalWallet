<ion-content [fullscreen]="true">
  <!-- Header curvo -->
  <div class="curved-header-bg ion-padding-top ion-padding-horizontal">
    <ion-buttons class="back-btn-container">
      <ion-back-button defaultHref="/home" color="light" text=""></ion-back-button>
    </ion-buttons>
    <div class="header-content ion-margin-top ion-margin-bottom">
      <h1 class="header-title">Add Card</h1>
      <p class="header-subtitle">Enter your card details</p>
    </div>
  </div>

  <div class="add-card-container ion-padding">
    
    <!-- Preview Card -->
    <div class="preview-section ion-margin-bottom">
      <app-card [card]="getPreviewCard()"></app-card>
    </div>

    <div class="glass-panel ion-padding form-wrapper">
      <form [formGroup]="cardForm" (ngSubmit)="onSubmit()">
        
        <!-- Nombre del Titular -->
        <div class="input-group">
          <ion-label position="stacked" class="premium-label">Card Holder Name</ion-label>
          <ion-input class="premium-input text-uppercase" type="text" formControlName="holderName" placeholder="JOHN DOE" maxlength="30"></ion-input>
          <div class="error-msg" *ngIf="isSubmitted && holderName?.invalid">
            Please enter a valid name.
          </div>
        </div>

        <!-- Número de Tarjeta -->
        <div class="input-group">
          <ion-label position="stacked" class="premium-label">Card Number</ion-label>
          <ion-input class="premium-input font-monospace" type="tel" formControlName="cardNumber" placeholder="0000 0000 0000 0000" maxlength="16"></ion-input>
          <div class="error-msg" *ngIf="isSubmitted && cardNumber?.invalid">
            Please enter a valid 16-digit card number.
          </div>
        </div>

        <!-- Expiración y CVV -->
        <ion-row class="input-row">
          <ion-col size="4" class="ion-no-padding padding-right-sm">
            <div class="input-group">
              <ion-label position="stacked" class="premium-label">Month</ion-label>
              <ion-input class="premium-input text-center" type="tel" formControlName="expiryMonth" placeholder="MM" maxlength="2"></ion-input>
            </div>
          </ion-col>
          <ion-col size="4" class="ion-no-padding padding-horizontal-sm">
            <div class="input-group">
              <ion-label position="stacked" class="premium-label">Year</ion-label>
              <ion-input class="premium-input text-center" type="tel" formControlName="expiryYear" placeholder="YY" maxlength="2"></ion-input>
            </div>
          </ion-col>
          <ion-col size="4" class="ion-no-padding padding-left-sm">
            <div class="input-group">
              <ion-label position="stacked" class="premium-label">CVV</ion-label>
              <ion-input class="premium-input text-center" type="password" formControlName="cvv" placeholder="***" maxlength="4"></ion-input>
            </div>
          </ion-col>
        </ion-row>

        <div class="error-msg text-center ion-margin-bottom" *ngIf="isSubmitted && (expiryMonth?.invalid || expiryYear?.invalid || cvv?.invalid)">
          Please check the expiration date and CVV.
        </div>

        <!-- Botón de Agregar -->
        <ion-button type="submit" expand="block" class="premium-btn ion-margin-top" [disabled]="isLoading">
          <ion-spinner *ngIf="isLoading" name="crescent" slot="start"></ion-spinner>
          {{ isLoading ? 'SAVING...' : 'SAVE CARD' }}
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
