<div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1">{{ label }}</label>
    <input [type]="type" [placeholder]="placeholder" [formControl]="control"
        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        [class.border-red-500]="control.invalid && control.touched"
        [class.border-gray-300]="!control.invalid || !control.touched" />
    <div *ngIf="control.invalid && control.touched" class="text-red-500 text-sm mt-1">
        <div *ngIf="control.errors?.['required']">Este campo es requerido</div>
        <div *ngIf="control.errors?.['email']">Ingresa un email válido</div>
        <div *ngIf="control.errors?.['minlength']">Mínimo {{ control.errors?.['minlength'].requiredLength }} caracteres
        </div>
    </div>
</div>
