<div class="bg-white rounded-lg shadow p-6 text-center">
    <h2 class="text-lg font-semibold text-gray-700 mb-2">Saldo Total</h2>
    <div class="text-3xl font-bold text-green-600 mb-4">
        {{ isVisible ? (balance | currency:'USD':'symbol':'1.2-2') : '****' }}
    </div>
    <button (click)="toggleVisibility()" class="text-blue-500 hover:text-blue-700">
        <ion-icon [name]="isVisible ? 'eye-off' : 'eye'"></ion-icon>
        {{ isVisible ? 'Ocultar' : 'Mostrar' }}
    </button>
</div>
