<div class="card-container" *ngIf="card"
    [ngClass]="{
       'card-visa': card.type === 'visa',
       'card-mastercard': card.type === 'mastercard',
       'card-amex': card.type === 'amex'
     }">
    <div class="card-glass-overlay">
        <!-- Top row: Type & Logo -->
        <div class="card-top">
            <span class="card-type">{{ card.type | uppercase }}</span>
            <div class="card-logo">
                <ion-icon name="logo-venmo" *ngIf="card.type === 'visa'"></ion-icon>
                <ion-icon name="disc-outline" *ngIf="card.type === 'mastercard'"></ion-icon>
                <ion-icon name="card-outline" *ngIf="card.type === 'amex'"></ion-icon>
            </div>
        </div>

        <!-- Chip icon -->
        <div class="card-chip">
            <ion-icon name="hardware-chip-outline"></ion-icon>
            <ion-icon name="wifi-outline" class="contactless-icon"></ion-icon>
        </div>

        <!-- Card Number -->
        <div class="card-number">
            {{ card.number | cardNumber }}
        </div>

        <!-- Bottom row: Holder & Expiry -->
        <div class="card-bottom">
            <div class="holder-info">
                <div class="info-label">Card Holder</div>
                <div class="info-value">{{ card.holderName || 'UNKNOWN NAME' | uppercase }}</div>
            </div>
            <div class="expiry-info">
                <div class="info-label">Expires</div>
                <div class="info-value">{{ card.expiryMonth }}/{{ card.expiryYear }}</div>
            </div>
        </div>
    </div>
</div>

<!-- Fallback if card is null -->
<div class="card-container empty-card" *ngIf="!card">
    <div class="card-glass-overlay">
        <ion-spinner name="crescent"></ion-spinner>
    </div>
</div>
