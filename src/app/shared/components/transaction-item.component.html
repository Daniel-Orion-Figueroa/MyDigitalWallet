<div class="flex items-center justify-between p-3 border-b border-gray-200">
    <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full flex items-center justify-center" [ngClass]="{
           'bg-green-100 text-green-600': transaction.type === 'income',
           'bg-red-100 text-red-600': transaction.type === 'expense'
         }">
            <span>{{ transaction.type === 'income' ? '↑' : '↓' }}</span>
        </div>
        <div>
            <div class="font-medium">{{ transaction.description }}</div>
            <div class="text-sm text-gray-500">{{ transaction.date | date:'short' }}</div>
        </div>
    </div>
    <div class="text-right">
        <div class="font-semibold" [ngClass]="{
           'text-green-600': transaction.type === 'income',
           'text-red-600': transaction.type === 'expense'
         }">
            {{ transaction.type === 'income' ? '+' : '-' }}{{ transaction.amount | currency:'USD':'symbol':'1.2-2' }}
        </div>
    </div>
</div>
